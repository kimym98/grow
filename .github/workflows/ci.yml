name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # apps/desktop/lib/supabase.ts가 클라이언트 생성 시점에 URL을 필수로 요구해
        # 값이 없으면 next build 자체가 실패한다. Settings > Secrets and variables > Actions에
        # NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY를 등록해야 한다
        # (apps/desktop/.env.example 참고. PUBLISHABLE_KEY는 클라이언트에 노출되는 공개 키라 유출 위험은 없다)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Test
        run: npm run test
