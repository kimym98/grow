name: Release

# v로 시작하는 태그(예: v1.0.0)를 push하면 Windows 인스톨러를 빌드해 GitHub Releases에 게시한다.
# 흐름은 docs/deployment_research.md의 "3. CI/CD 배포 파이프라인 흐름"과 동일하다:
# checkout -> 의존성 설치 -> next build(+electron 빌드) -> electron-builder --publish always로 게시
# -> 이미 설치된 사용자의 electron-updater가 새 릴리스를 감지해 자동 업데이트한다.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Next.js + Electron 빌드
        # SENTRY_DSN/NEXT_PUBLIC_SENTRY_DSN은 아직 이 프로젝트에 발급된 값이 없어 비워둔 자리다.
        # secrets에 등록하지 않으면 빈 문자열로 전달되어 apps/desktop/lib/sentry.ts, electron/main.ts의
        # initSentryIfConfigured가 그대로 no-op 처리한다(빌드/실행 실패 없음)
        run: npm run build -w apps/desktop
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: electron-builder 패키징 및 GitHub Releases 게시
        # electron-builder v27부터 --publish always를 명시해야 실제로 게시된다(암시적 게시는 기본 비활성화).
        # 코드 서명 인증서가 아직 없는 상태라 Windows SmartScreen 경고는 계속 뜨지만
        # (docs/deployment_research.md 2절 참고), verifyUpdateCodeSignature: false 설정 덕분에
        # 서명 없이도 electron-updater 자동 업데이트는 정상 동작한다.
        # 추후 코드 서명 인증서를 발급받으면 CSC_LINK/CSC_KEY_PASSWORD secrets를 추가하고
        # 이 스텝의 env에 등록하는 것만으로 electron-builder가 자동으로 서명을 적용한다.
        working-directory: apps/desktop
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
